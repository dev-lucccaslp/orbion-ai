# Gera os instaladores do Orbion.ai para Windows, macOS e Linux e publica no GitHub Releases.
# Roda quando sobe uma tag de versão (git tag v0.1.0 && git push origin v0.1.0) ou à mão, pela aba Actions.
# Os arquivos têm nome fixo, então os links de download do README sempre apontam para a última versão.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instaladores:
    name: Instalador ${{ matrix.nome }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nome: Windows
          - os: macos-latest
            nome: macOS
          - os: ubuntu-latest
            nome: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Empacotar
        run: npx --yes electron-builder@26 --publish never
        env:
          # Sem certificado de assinatura por enquanto (o Windows e o macOS avisam na primeira abertura).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.nome }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  publicar:
    name: Publicar a versão
    needs: instaladores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o histórico inteiro, para as notas saírem dos commits desde a versão anterior
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true
      - name: Criar o release com os instaladores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSAO="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v*) ;; *) TAG="$VERSAO" ;; esac
          ls -la instaladores
          # O que mudou: cada commit desde a versão anterior, com o título e a lista do corpo da mensagem.
          # É essa nota que o Orbion mostra depois de atualizar.
          ANTERIOR="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          git log --no-merges --format='### %s%n%n%b' "${ANTERIOR:+$ANTERIOR..}HEAD" | grep -v '^Co-Authored-By:' > notas.md
          if [ -n "$ANTERIOR" ]; then printf '\n[Tudo o que mudou desde %s](https://github.com/%s/compare/%s...%s)\n' "$ANTERIOR" "$GITHUB_REPOSITORY" "$ANTERIOR" "$TAG" >> notas.md; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" instaladores/* --clobber
            gh release edit "$TAG" --notes-file notas.md
          else
            gh release create "$TAG" instaladores/* --title "Orbion.ai $TAG" --notes-file notas.md --target "$GITHUB_SHA"
          fi

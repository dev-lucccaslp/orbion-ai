<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seu carrinho</title>
  <style>
    :root {
      color-scheme: light dark;

      --cor-fundo: #F7F8FA;
      --cor-superficie: #EDF0F5;
      --cor-campo: #FFFFFF;
      --cor-texto: #14213D;
      --cor-texto-suave: #4A5568;
      --cor-borda: #D5DAE3;
      --cor-borda-campo: #7A8599;
      --cor-destaque: #2446C7;
      --cor-destaque-hover: #1B37A3;
      --cor-destaque-texto: #FBFCFE;
      --cor-erro: #B42318;
      --cor-erro-fundo: #FDECEA;
      --cor-sucesso: #1B6E45;
      --cor-total-fundo: #14213D;
      --cor-total-texto: #F4F6F9;
      --cor-total-rotulo: #B9C3D6;
      --cor-esqueleto: #DCE1EA;
      --cor-desabilitado-fundo: #C9CFDA;
      --cor-desabilitado-texto: #4A5568;

      --fonte: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      --texto-pequeno: 0.875rem;
      --texto-base: 1rem;
      --texto-medio: 1.25rem;
      --texto-titulo: 1.953rem;
      --texto-total: 2.441rem;

      --esp-1: 4px;
      --esp-2: 8px;
      --esp-3: 12px;
      --esp-4: 16px;
      --esp-5: 20px;
      --esp-6: 24px;
      --esp-8: 32px;
      --esp-12: 48px;
      --esp-16: 64px;

      --raio-esqueleto: 4px;
      --raio-controle: 8px;
      --raio-painel: 12px;

      --sombra-painel: 0 1px 2px rgb(20 33 61 / 0.06), 0 12px 32px -12px rgb(20 33 61 / 0.18);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --cor-fundo: #0F1626;
        --cor-superficie: #18233A;
        --cor-campo: #0F1626;
        --cor-texto: #E6EAF2;
        --cor-texto-suave: #A3ADC2;
        --cor-borda: #2C3954;
        --cor-borda-campo: #7D89A3;
        --cor-destaque: #8FA6FF;
        --cor-destaque-hover: #B3C2FF;
        --cor-destaque-texto: #0F1626;
        --cor-erro: #FF8A80;
        --cor-erro-fundo: #3A1F24;
        --cor-sucesso: #6FD3A0;
        --cor-total-fundo: #2446C7;
        --cor-total-texto: #FBFCFE;
        --cor-total-rotulo: #D5DCF5;
        --cor-esqueleto: #2C3954;
        --cor-desabilitado-fundo: #2C3954;
        --cor-desabilitado-texto: #A3ADC2;
        --sombra-painel: none;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }

    /* Garante que [hidden] vença os display: flex/grid abaixo. */
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: var(--cor-fundo);
      color: var(--cor-texto);
      font-family: var(--fonte);
      font-size: var(--texto-base);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .visualmente-oculto {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    .pagina {
      max-width: 60rem;
      margin: 0 auto;
      padding: var(--esp-8) var(--esp-4) var(--esp-16);
    }

    /* Cabeçalho */
    .cabecalho { margin-bottom: var(--esp-8); }
    .cabecalho h1 {
      margin: 0;
      font-size: 1.563rem;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.015em;
    }
    .cabecalho-contagem {
      margin: var(--esp-1) 0 0;
      color: var(--cor-texto-suave);
    }

    /* Aviso de falha ao carregar as regras */
    .aviso-falha {
      margin: 0 0 var(--esp-6);
      padding: var(--esp-3) var(--esp-4);
      background: var(--cor-erro-fundo);
      color: var(--cor-texto);
      border-left: 4px solid var(--cor-erro);
      border-radius: var(--raio-controle);
    }

    /* Grade principal */
    .carrinho {
      display: grid;
      gap: var(--esp-8);
    }

    /* Itens */
    .itens-lista {
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 2px solid var(--cor-texto);
    }
    .item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      column-gap: var(--esp-4);
      padding: var(--esp-4) 0;
    }
    .item + .item { border-top: 1px solid var(--cor-borda); }
    .item-nome {
      grid-column: 1;
      font-size: var(--texto-medio);
      font-weight: 600;
      line-height: 1.3;
    }
    .item-detalhe {
      grid-column: 1;
      color: var(--cor-texto-suave);
      font-size: var(--texto-pequeno);
    }
    .item-total {
      grid-column: 2;
      grid-row: 1 / span 2;
      align-self: center;
      font-weight: 600;
    }
    .itens-vazio {
      margin: 0;
      padding: var(--esp-6) 0;
      color: var(--cor-texto-suave);
      border-top: 2px solid var(--cor-texto);
    }

    /* Valores monetários */
    .valor {
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .valor--economia { color: var(--cor-sucesso); }
    .valor:empty::before {
      content: "";
      display: inline-block;
      width: 5.5em;
      height: 1em;
      vertical-align: middle;
      border-radius: var(--raio-esqueleto);
      background: var(--cor-esqueleto);
    }

    /* Painel do resumo */
    .resumo {
      padding: var(--esp-6) var(--esp-6) 0;
      background: var(--cor-superficie);
      border-radius: var(--raio-painel);
      box-shadow: var(--sombra-painel);
      overflow: hidden;
    }
    .resumo-titulo {
      margin: 0 0 var(--esp-4);
      font-size: var(--texto-medio);
      font-weight: 600;
      line-height: 1.3;
    }

    /* Cupom */
    .cupom {
      display: grid;
      gap: var(--esp-2);
      padding-bottom: var(--esp-5);
      border-bottom: 1px solid var(--cor-borda);
    }
    .cupom-rotulo {
      font-size: var(--texto-pequeno);
      font-weight: 600;
    }
    .cupom-linha {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: var(--esp-2);
    }
    .cupom-campo {
      min-width: 0;
      min-height: 44px;
      padding: 0 var(--esp-3);
      font: inherit;
      letter-spacing: 0.04em;
      color: var(--cor-texto);
      background: var(--cor-campo);
      border: 1px solid var(--cor-borda-campo);
      border-radius: var(--raio-controle);
    }
    .cupom-campo:hover { border-color: var(--cor-texto-suave); }
    .cupom-campo:focus {
      border-color: var(--cor-destaque);
      outline: 2px solid var(--cor-destaque);
      outline-offset: 2px;
    }
    .cupom-campo[aria-invalid="true"] {
      border-color: var(--cor-erro);
      box-shadow: inset 0 0 0 1px var(--cor-erro);
    }
    .cupom-campo:disabled {
      color: var(--cor-texto-suave);
      background: var(--cor-superficie);
      border-color: var(--cor-borda);
      cursor: not-allowed;
    }

    .botao {
      min-height: 44px;
      padding: 0 var(--esp-5);
      font: inherit;
      font-weight: 600;
      white-space: nowrap;
      color: var(--cor-destaque-texto);
      background: var(--cor-destaque);
      border: 0;
      border-radius: var(--raio-controle);
      cursor: pointer;
      transition: background-color 120ms ease, transform 80ms ease;
    }
    .botao:hover { background: var(--cor-destaque-hover); }
    .botao:active { transform: translateY(1px); }
    .botao:focus-visible {
      outline: 2px solid var(--cor-destaque);
      outline-offset: 2px;
    }
    .botao:disabled {
      color: var(--cor-desabilitado-texto);
      background: var(--cor-desabilitado-fundo);
      cursor: not-allowed;
      transform: none;
    }

    .cupom-erro,
    .cupom-status,
    .cupom-ajuda {
      margin: 0;
      font-size: var(--texto-pequeno);
    }
    .cupom-erro { color: var(--cor-erro); font-weight: 600; }
    .cupom-status { color: var(--cor-sucesso); font-weight: 600; }
    .cupom-ajuda { color: var(--cor-texto-suave); }

    /* Linhas do resumo */
    .resumo-linhas {
      display: grid;
      gap: var(--esp-2);
      margin: 0;
      padding: var(--esp-4) 0 var(--esp-5);
    }
    .resumo-linha {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: var(--esp-4);
    }
    .resumo-linha dt { color: var(--cor-texto-suave); }
    .resumo-linha dd { margin: 0; font-weight: 600; }

    /* Faixa do total */
    .resumo-total {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: var(--esp-4);
      margin: 0 calc(var(--esp-6) * -1);
      padding: var(--esp-5) var(--esp-6);
      color: var(--cor-total-texto);
      background: var(--cor-total-fundo);
    }
    .resumo-total-rotulo {
      font-weight: 600;
      color: var(--cor-total-rotulo);
    }
    .resumo-total-valor {
      display: inline-block;
      font-size: 1.953rem;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }
    .resumo-total .valor:empty::before {
      width: 4em;
      background: rgb(255 255 255 / 0.18);
    }

    /* Computador */
    @media (min-width: 768px) {
      .pagina { padding: var(--esp-16) var(--esp-8); }
      .cabecalho h1 { font-size: var(--texto-titulo); }
      .carrinho {
        grid-template-columns: minmax(0, 1.4fr) minmax(18rem, 1fr);
        gap: var(--esp-12);
        align-items: start;
      }
      .resumo-total-valor { font-size: var(--texto-total); }
    }

    /* Movimento: só como resposta ao Aplicar */
    @media (prefers-reduced-motion: no-preference) {
      .resumo-total-valor.is-atualizado {
        animation: total-atualizado 320ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      .cupom-erro:not([hidden]),
      .cupom-status:not([hidden]) {
        animation: mensagem-aparece 180ms ease-out;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .botao { transition: none; }
      .botao:active { transform: none; }
    }

    @keyframes total-atualizado {
      from { opacity: 0.35; transform: translateY(2px); }
      to   { opacity: 1;    transform: translateY(0); }
    }
    @keyframes mensagem-aparece {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>
  <main class="pagina">
    <header class="cabecalho">
      <h1>Seu carrinho</h1>
      <p class="cabecalho-contagem" id="contagem"></p>
    </header>

    <p class="aviso-falha" id="aviso-falha" role="alert" hidden></p>

    <div class="carrinho">
      <section class="itens" aria-labelledby="titulo-itens">
        <h2 id="titulo-itens" class="visualmente-oculto">Itens do carrinho</h2>
        <ul class="itens-lista" id="itens-lista"></ul>
      </section>

      <aside class="resumo" aria-labelledby="titulo-resumo">
        <h2 id="titulo-resumo" class="resumo-titulo">Resumo do pedido</h2>

        <form class="cupom" id="cupom-form" novalidate>
          <label class="cupom-rotulo" for="cupom-campo">Cupom de desconto</label>
          <div class="cupom-linha">
            <input class="cupom-campo" id="cupom-campo" name="cupom" type="text"
                   autocomplete="off" autocapitalize="characters" spellcheck="false"
                   aria-describedby="cupom-erro cupom-ajuda">
            <button class="botao" id="cupom-botao" type="submit">Aplicar</button>
          </div>
          <p class="cupom-erro" id="cupom-erro" role="alert" hidden></p>
          <p class="cupom-status" id="cupom-status" role="status" hidden></p>
          <p class="cupom-ajuda" id="cupom-ajuda">Um cupom por compra.</p>
        </form>

        <dl class="resumo-linhas">
          <div class="resumo-linha">
            <dt>Subtotal</dt>
            <dd class="valor" id="valor-subtotal"></dd>
          </div>
          <div class="resumo-linha" id="linha-desconto" hidden>
            <dt id="rotulo-desconto">Desconto</dt>
            <dd class="valor valor--economia" id="valor-desconto"></dd>
          </div>
          <div class="resumo-linha">
            <dt id="rotulo-frete">Frete</dt>
            <dd class="valor" id="valor-frete"></dd>
          </div>
        </dl>

        <div class="resumo-total" aria-live="polite">
          <span class="resumo-total-rotulo">Total</span>
          <span class="resumo-total-valor valor" id="valor-total"></span>
        </div>
      </aside>
    </div>
  </main>

  <!-- Script clássico (não type="module") para funcionar também via file://. -->
  <script src="../src/carrinho.js"></script>
  <script>
    (function () {
      'use strict';

      // Carrinho de exemplo. Todos os cálculos vêm de src/carrinho.js (window.Carrinho).
      var itens = [
        { nome: 'Camiseta', preco: 49.90, quantidade: 2 },
        { nome: 'Caneca', preco: 29.90, quantidade: 1 },
        { nome: 'Adesivo', preco: 5.00, quantidade: 3 },
      ];

      var moeda = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
      function formatar(valor) { return moeda.format(valor); }
      function centavos(valor) { return Math.round(valor * 100) / 100; }

      var el = {
        contagem: document.getElementById('contagem'),
        avisoFalha: document.getElementById('aviso-falha'),
        lista: document.getElementById('itens-lista'),
        form: document.getElementById('cupom-form'),
        campo: document.getElementById('cupom-campo'),
        botao: document.getElementById('cupom-botao'),
        erro: document.getElementById('cupom-erro'),
        status: document.getElementById('cupom-status'),
        linhaDesconto: document.getElementById('linha-desconto'),
        rotuloDesconto: document.getElementById('rotulo-desconto'),
        valorDesconto: document.getElementById('valor-desconto'),
        rotuloFrete: document.getElementById('rotulo-frete'),
        valorSubtotal: document.getElementById('valor-subtotal'),
        valorFrete: document.getElementById('valor-frete'),
        valorTotal: document.getElementById('valor-total'),
      };

      var Carrinho = window.Carrinho;
      if (!Carrinho) {
        el.avisoFalha.textContent = 'Não foi possível carregar as regras do carrinho (../src/carrinho.js). Confira se o arquivo existe e recarregue a página.';
        el.avisoFalha.hidden = false;
        el.campo.disabled = true;
        el.botao.disabled = true;
        el.valorSubtotal.textContent = 'Indisponível';
        el.valorFrete.textContent = 'Indisponível';
        el.valorTotal.textContent = 'Indisponível';
        el.lista.innerHTML = '';
        itens.forEach(function (item) {
          var li = document.createElement('li');
          li.className = 'item';
          li.innerHTML = '<span class="item-nome"></span><span class="item-detalhe valor"></span><span class="item-total valor"></span>';
          li.querySelector('.item-nome').textContent = item.nome;
          li.querySelector('.item-detalhe').textContent = 'Indisponível';
          li.querySelector('.item-total').textContent = 'Indisponível';
          el.lista.appendChild(li);
        });
        return;
      }

      function plural(n, singular, pluralTxt) { return n + ' ' + (n === 1 ? singular : pluralTxt); }

      function renderizarItens() {
        var produtos = itens.length;
        var unidades = Carrinho.quantidadeDeItens(itens);
        el.contagem.textContent = plural(produtos, 'produto', 'produtos') + ', ' + plural(unidades, 'unidade', 'unidades');

        el.lista.innerHTML = '';
        if (produtos === 0) {
          var vazio = document.createElement('p');
          vazio.className = 'itens-vazio';
          vazio.textContent = 'Seu carrinho está vazio.';
          el.lista.replaceWith(vazio);
          el.campo.disabled = true;
          el.botao.disabled = true;
          return;
        }
        itens.forEach(function (item) {
          var li = document.createElement('li');
          li.className = 'item';
          var nome = document.createElement('span');
          nome.className = 'item-nome';
          nome.textContent = item.nome;
          var detalhe = document.createElement('span');
          detalhe.className = 'item-detalhe valor';
          detalhe.textContent = formatar(item.preco) + ' × ' + item.quantidade;
          var totalLinha = document.createElement('span');
          totalLinha.className = 'item-total valor';
          totalLinha.textContent = formatar(Carrinho.subtotal([item]));
          li.appendChild(nome);
          li.appendChild(detalhe);
          li.appendChild(totalLinha);
          el.lista.appendChild(li);
        });
      }

      // Calcula o resumo só com as funções da biblioteca. Lança o Error de total() se o cupom for inválido.
      function calcularResumo(cupom) {
        var frete = Carrinho.FRETE_PADRAO;
        var sub = Carrinho.subtotal(itens);
        var totalFinal = Carrinho.total(itens, frete, cupom);
        // Frete efetivo e desconto saem por diferença, sem repetir as regras dos cupons.
        var freteEfetivo = centavos(totalFinal - Carrinho.total(itens, 0, cupom));
        var desconto = centavos(sub + freteEfetivo - totalFinal);
        return { subtotal: sub, frete: freteEfetivo, desconto: desconto, total: totalFinal };
      }

      function renderizarResumo(resumo, codigo, animar) {
        el.valorSubtotal.textContent = formatar(resumo.subtotal);

        if (resumo.desconto > 0) {
          el.rotuloDesconto.textContent = 'Desconto (' + codigo + ')';
          el.valorDesconto.textContent = '−' + formatar(resumo.desconto);
          el.linhaDesconto.hidden = false;
        } else {
          el.linhaDesconto.hidden = true;
          el.valorDesconto.textContent = '';
        }

        var freteZerado = codigo !== null && resumo.frete === 0;
        el.rotuloFrete.textContent = freteZerado ? 'Frete (' + codigo + ')' : 'Frete';
        el.valorFrete.textContent = formatar(resumo.frete);
        el.valorFrete.classList.toggle('valor--economia', freteZerado);

        var novoTotal = formatar(resumo.total);
        if (el.valorTotal.textContent !== novoTotal) {
          el.valorTotal.textContent = novoTotal;
          if (animar) {
            el.valorTotal.classList.remove('is-atualizado');
            void el.valorTotal.offsetWidth;
            el.valorTotal.classList.add('is-atualizado');
          }
        }
      }

      function aplicarCupom(texto) {
        el.erro.hidden = true;
        el.erro.textContent = '';
        el.status.hidden = true;
        el.status.textContent = '';
        el.campo.removeAttribute('aria-invalid');

        try {
          var resumo = calcularResumo(texto);
          // Só depois de total() aceitar o cupom: normalização usada apenas para exibir o código.
          var limpo = texto.trim();
          var codigo = limpo === '' ? null : limpo.toUpperCase();
          renderizarResumo(resumo, codigo, true);
          if (codigo !== null) {
            el.status.textContent = 'Cupom ' + codigo + ' aplicado.';
            el.status.hidden = false;
          }
        } catch (erro) {
          renderizarResumo(calcularResumo(undefined), null, true);
          el.erro.textContent = erro.message;
          el.erro.hidden = false;
          el.campo.setAttribute('aria-invalid', 'true');
        }
      }

      el.form.addEventListener('submit', function (evento) {
        evento.preventDefault();
        aplicarCupom(el.campo.value);
      });

      renderizarItens();
      renderizarResumo(calcularResumo(undefined), null, false);
    })();
  </script>
</body>
</html>
